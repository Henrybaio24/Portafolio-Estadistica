<svg width="100%" viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="sl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B8321F"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="sa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(184,50,31,0.25)"/>
      <stop offset="100%" stop-color="rgba(184,50,31,0)"/>
    </linearGradient>
  </defs>

  <rect x="10" y="10" width="660" height="260" rx="20" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Ejes principales -->
  <line x1="60" y1="220" x2="620" y2="220" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="40" x2="60" y2="220" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Flechas de ejes -->
  <polygon points="620,220 610,215 610,225" fill="#374151"/>
  <polygon points="60,40 55,50 65,50" fill="#374151"/>

  <!-- Grid móvil -->
  <g stroke="#E5E7EB" stroke-width="1" opacity="0.5">
    <line x1="60" y1="80" x2="620" y2="80">
      <animate attributeName="x1" values="60;80;60" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="620;640;620" dur="6s" repeatCount="indefinite"/>
    </line>
    <line x1="60" y1="130" x2="620" y2="130">
      <animate attributeName="x1" values="60;40;60" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="620;600;620" dur="8s" repeatCount="indefinite"/>
    </line>
    <line x1="60" y1="180" x2="620" y2="180">
      <animate attributeName="x1" values="60;70;60" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="620;630;620" dur="7s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Línea de tendencia con marcadores -->
  <path d="M80,190 C140,170 180,140 240,120 S360,80 420,70 S540,50 600,45" 
        fill="none" stroke="url(#sl)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="600" stroke-dashoffset="600">
    <animate attributeName="stroke-dashoffset" from="600" to="0" dur="3s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </path>

  <!-- Área bajo la curva -->
  <path d="M80,190 C140,170 180,140 240,120 S360,80 420,70 S540,50 600,45 L600,220 L80,220 Z" 
        fill="url(#sa)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="1.5s" fill="freeze" begin="2s"/>
  </path>

  <!-- Marcadores de datos (cuadrados) -->
  <rect x="76" y="186" width="8" height="8" rx="2" fill="#B8321F" stroke="white" stroke-width="2">
    <animate attributeName="y" values="186;182;186" dur="2s" repeatCount="indefinite" begin="2.5s"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite" begin="2.5s"/>
  </rect>
  <rect x="236" y="116" width="8" height="8" rx="2" fill="#B8321F" stroke="white" stroke-width="2">
    <animate attributeName="y" values="116;112;116" dur="2.5s" repeatCount="indefinite" begin="3s"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="2.5s" repeatCount="indefinite" begin="3s"/>
  </rect>
  <rect x="356" y="76" width="8" height="8" rx="2" fill="#F59E0B" stroke="white" stroke-width="2">
    <animate attributeName="y" values="76;72;76" dur="2s" repeatCount="indefinite" begin="3.5s"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite" begin="3.5s"/>
  </rect>
  <rect x="476" y="66" width="8" height="8" rx="2" fill="#B8321F" stroke="white" stroke-width="2">
    <animate attributeName="y" values="66;62;66" dur="2.5s" repeatCount="indefinite" begin="4s"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="2.5s" repeatCount="indefinite" begin="4s"/>
  </rect>
  <rect x="596" y="41" width="10" height="10" rx="3" fill="#F59E0B" stroke="white" stroke-width="2">
    <animate attributeName="y" values="41;36;41" dur="2s" repeatCount="indefinite" begin="4.5s"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite" begin="4.5s"/>
  </rect>

  <!-- Líneas guía punteadas desde marcadores al eje X -->
  <line x1="80" y1="194" x2="80" y2="220" stroke="#B8321F" stroke-width="1" stroke-dasharray="3,3" opacity="0.3"/>
  <line x1="240" y1="124" x2="240" y2="220" stroke="#B8321F" stroke-width="1" stroke-dasharray="3,3" opacity="0.3"/>
  <line x1="360" y1="84" x2="360" y2="220" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3,3" opacity="0.3"/>
  <line x1="480" y1="74" x2="480" y2="220" stroke="#B8321F" stroke-width="1" stroke-dasharray="3,3" opacity="0.3"/>
  <line x1="600" y1="50" x2="600" y2="220" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3,3" opacity="0.3"/>

  <!-- Barras de fondo decorativas (detrás de la línea) -->
  <rect x="100" y="140" width="12" height="80" rx="4" fill="#E5E7EB" opacity="0.4">
    <animate attributeName="height" values="60;90;60" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="y" values="160;130;160" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="160" y="120" width="12" height="100" rx="4" fill="#E5E7EB" opacity="0.4">
    <animate attributeName="height" values="80;110;80" dur="5s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="y" values="140;110;140" dur="5s" repeatCount="indefinite" begin="1s"/>
  </rect>
  <rect x="280" y="100" width="12" height="120" rx="4" fill="#E5E7EB" opacity="0.4">
    <animate attributeName="height" values="100;130;100" dur="4.5s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="y" values="120;90;120" dur="4.5s" repeatCount="indefinite" begin="0.5s"/>
  </rect>
  <rect x="400" y="90" width="12" height="130" rx="4" fill="#E5E7EB" opacity="0.4">
    <animate attributeName="height" values="110;140;110" dur="5.5s" repeatCount="indefinite" begin="1.5s"/>
    <animate attributeName="y" values="110;80;110" dur="5.5s" repeatCount="indefinite" begin="1.5s"/>
  </rect>
  <rect x="520" y="80" width="12" height="140" rx="4" fill="#E5E7EB" opacity="0.4">
    <animate attributeName="height" values="120;150;120" dur="4s" repeatCount="indefinite" begin="2s"/>
    <animate attributeName="y" values="100;70;100" dur="4s" repeatCount="indefinite" begin="2s"/>
  </rect>

  <!-- Partículas flotantes -->
  <circle cx="130" cy="60" r="4" fill="#B8321F" opacity="0.2">
    <animate attributeName="cy" values="60;40;60" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="100" r="3" fill="#F59E0B" opacity="0.3">
    <animate attributeName="cy" values="100;80;100" dur="4s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="cx" values="450;470;450" dur="5s" repeatCount="indefinite" begin="1s"/>
  </circle>

  <!-- Sigma decorativo -->
  <text x="630" y="240" fill="#B8321F" font-family="Georgia,serif" font-size="42" opacity="0.06" font-style="italic">Σ</text>
</svg>
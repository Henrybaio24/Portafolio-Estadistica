<svg width="100%" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="border-radius:16px; display:block;">
  <defs>
    <linearGradient id="el" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="ea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(99,102,241,0.3)"/>
      <stop offset="100%" stop-color="rgba(99,102,241,0)"/>
    </linearGradient>
  </defs>

  <rect x="10" y="10" width="660" height="240" rx="20" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Ejes principales -->
  <line x1="80" y1="200" x2="600" y2="200" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  <line x1="340" y1="40" x2="340" y2="200" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Flechas -->
  <polygon points="600,200 590,195 590,205" fill="#374151"/>
  <polygon points="340,40 335,50 345,50" fill="#374151"/>

  <!-- Grid móvil -->
  <g stroke="#E5E7EB" stroke-width="1" opacity="0.4">
    <line x1="80" y1="80" x2="600" y2="80">
      <animate attributeName="x1" values="80;100;80" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="600;620;600" dur="7s" repeatCount="indefinite"/>
    </line>
    <line x1="80" y1="120" x2="600" y2="120">
      <animate attributeName="x1" values="80;60;80" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="600;580;600" dur="9s" repeatCount="indefinite"/>
    </line>
    <line x1="80" y1="160" x2="600" y2="160">
      <animate attributeName="x1" values="80;90;80" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="600;610;600" dur="8s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Campana de Gauss principal -->
  <path d="M100,200 C140,200 170,190 200,170 C230,150 250,120 280,90 C300,70 320,55 340,50 C360,55 380,70 400,90 C430,120 450,150 480,170 C510,190 540,200 580,200" 
        fill="none" stroke="url(#el)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="800" stroke-dashoffset="800">
    <animate attributeName="stroke-dashoffset" from="800" to="0" dur="3s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </path>

  <!-- Área bajo la curva -->
  <path d="M100,200 C140,200 170,190 200,170 C230,150 250,120 280,90 C300,70 320,55 340,50 C360,55 380,70 400,90 C430,120 450,150 480,170 C510,190 540,200 580,200 L580,210 L100,210 Z" 
        fill="url(#ea)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="1.5s" fill="freeze" begin="2s"/>
  </path>

  <!-- Líneas sigma verticales -->
  <line x1="250" y1="50" x2="250" y2="200" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="5,5" opacity="0">
    <animate attributeName="opacity" from="0" to="0.4" dur="0.5s" fill="freeze" begin="2.5s"/>
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3s" repeatCount="indefinite" begin="3s"/>
  </line>
  <line x1="340" y1="50" x2="340" y2="200" stroke="#6366F1" stroke-width="2" stroke-dasharray="5,5" opacity="0">
    <animate attributeName="opacity" from="0" to="0.6" dur="0.5s" fill="freeze" begin="2.7s"/>
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="3s" repeatCount="indefinite" begin="3.2s"/>
  </line>
  <line x1="430" y1="50" x2="430" y2="200" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="5,5" opacity="0">
    <animate attributeName="opacity" from="0" to="0.4" dur="0.5s" fill="freeze" begin="2.9s"/>
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3s" repeatCount="indefinite" begin="3.4s"/>
  </line>

  <!-- Marcas en el eje X -->
  <line x1="160" y1="200" x2="160" y2="205" stroke="#374151" stroke-width="2"/>
  <line x1="250" y1="200" x2="250" y2="205" stroke="#6366F1" stroke-width="2"/>
  <line x1="340" y1="200" x2="340" y2="205" stroke="#6366F1" stroke-width="2"/>
  <line x1="430" y1="200" x2="430" y2="205" stroke="#6366F1" stroke-width="2"/>
  <line x1="520" y1="200" x2="520" y2="205" stroke="#374151" stroke-width="2"/>

  <!-- Puntos de dispersión alrededor -->
  <circle cx="140" cy="180" r="5" fill="#6366F1" opacity="0.5">
    <animate attributeName="r" values="4;7;4" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="190" cy="150" r="5" fill="#8B5CF6" opacity="0.6">
    <animate attributeName="r" values="4;7;4" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="3s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="340" cy="55" r="6" fill="#6366F1" opacity="0.8">
    <animate attributeName="r" values="5;9;5" dur="2s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle cx="490" cy="150" r="5" fill="#8B5CF6" opacity="0.6">
    <animate attributeName="r" values="4;7;4" dur="2.8s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
  <circle cx="540" cy="180" r="5" fill="#6366F1" opacity="0.5">
    <animate attributeName="r" values="4;7;4" dur="3.2s" repeatCount="indefinite" begin="0.8s"/>
  </circle>

  <!-- Partículas flotantes -->
  <circle cx="120" cy="70" r="3" fill="#6366F1" opacity="0.2">
    <animate attributeName="cy" values="70;50;70" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="120;140;120" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="560" cy="100" r="2.5" fill="#8B5CF6" opacity="0.3">
    <animate attributeName="cy" values="100;80;100" dur="4s" repeatCount="indefinite" begin="1s"/>
  </circle>

  <!-- Círculos concéntricos que respiran -->
  <circle cx="560" cy="70" r="35" fill="none" stroke="#6366F1" stroke-width="1" opacity="0.1">
    <animate attributeName="r" values="30;45;30" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.2;0.1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="560" cy="70" r="22" fill="none" stroke="#8B5CF6" stroke-width="1" opacity="0.15">
    <animate attributeName="r" values="18;30;18" dur="3s" repeatCount="indefinite" begin="1s"/>
  </circle>

  <!-- Sigma decorativo -->
  <text x="600" y="230" fill="#6366F1" font-family="Georgia,serif" font-size="38" opacity="0.08" font-style="italic">σ</text>
</svg>